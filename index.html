<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/5b7b940d8e.js" crossorigin="anonymous"></script>
    <title>Hailey Jane Garrett</title>

<body>
    <section id="landing">

                    </li>
                    <li class="nav__link">
                        <a href="#projects" class="nav__icon tooltip" data-tooltip="Projects">

                        <a href="#" class="nav__icon tooltip" data-tooltip="Home">

                    </li>
                    <li class="nav__link">
                        <a href="#" class="nav__icon tooltip" data-tooltip="Obsidian Profile">
                            <i class="fa-brands fa-obsidian"></i>
                        </a>
                    </li>
                    <li class="nav__link">
                        <a href="#contact" class="nav__icon tooltip" data-tooltip="Contact">

                        </a>
                    </li>

            </div>
        </nav>

    <script src="./index.js"></script>
